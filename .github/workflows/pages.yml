name: Verify and publish Cortex
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: node scripts/build-docs.mjs && git diff --exit-code -- guide.html guide-pl.html whitepaper.html whitepaper-pl.html landing.html
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check published release
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS --retry 2 "${SITE}release.json?verify=${GITHUB_SHA}" -o release.json
            if node -e 'const fs=require("fs");if(JSON.parse(fs.readFileSync("release.json")).commit!==process.env.GITHUB_SHA)process.exit(1)'; then exit 0; fi
            sleep 10
          done
          exit 1
